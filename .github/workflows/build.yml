name: Android Build

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch: {}

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # release 서명 secrets(LMA_KEYSTORE_BASE64/LMA_KEYSTORE_PASSWORD/LMA_KEY_ALIAS/
      # LMA_KEY_PASSWORD)가 저장소 Settings > Secrets에 설정돼 있으면 release APK도
      # 실제 키로 서명된다. 없으면 release는 자동으로 debug 키로 서명되어(빌드는 항상
      # 성공한다) 배포용으로는 못 쓰지만 빌드 실패는 일어나지 않는다.
      - name: Decode release keystore (optional)
        id: keystore
        if: ${{ env.LMA_KEYSTORE_BASE64 != '' }}
        env:
          LMA_KEYSTORE_BASE64: ${{ secrets.LMA_KEYSTORE_BASE64 }}
        run: |
          echo "$LMA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build release APK
        env:
          LMA_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          LMA_KEYSTORE_PASSWORD: ${{ secrets.LMA_KEYSTORE_PASSWORD }}
          LMA_KEY_ALIAS: ${{ secrets.LMA_KEY_ALIAS }}
          LMA_KEY_PASSWORD: ${{ secrets.LMA_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon
        continue-on-error: true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lm-arena-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: lm-arena-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
